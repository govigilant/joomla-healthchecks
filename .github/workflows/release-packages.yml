name: Package release artifacts

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        joomla: [5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Build Joomla ${{ matrix.joomla }} package
        run: ZIP_NAME="plg_system_vigilanthealthchecks-joomla${{ matrix.joomla }}.zip" sh scripts/package-jed.sh

      - name: Upload Joomla ${{ matrix.joomla }} asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/plg_system_vigilanthealthchecks-joomla${{ matrix.joomla }}.zip
